    var el = document.createElement("div");
    el.className = "note" + (isNew ? " new" : "");
    el.dataset.id = n.id;
    el.style.left = n.x + "px";
    el.style.top = n.y + "px";
    el.style.width = (n.w || NOTE_W) + "px";
    el.style.zIndex = n.z;
    el.style.setProperty("--note-bg", n.bg);
    el.style.setProperty("--rot", n.rot + "deg");
    n.el = el;

    var tab = document.createElement("div");
    tab.className = "tab";
    el.appendChild(tab);

    var del = document.createElement("button");
    del.className = "del";
    del.setAttribute("aria-label","Delete note");
    del.innerHTML = ICONS.close;
    el.appendChild(del);

    if(n.isTask){
      var badge = document.createElement("div");
      badge.className = "badge" + (n.done ? " done" : "");
      badge.textContent = n.due ? ("Due " + n.due + (n.dueTime ? ", " + n.dueTime : "")) : "Task";
      el.appendChild(badge);
      n.badgeEl = badge;
    }

    if(n.image){
      var imgWrap = document.createElement("div");
      imgWrap.className = "noteImgWrap";
      var img = document.createElement("img");
      img.src = n.image;
      img.alt = "";
      imgWrap.appendChild(img);
      if(!readOnly){
        var rmImg = document.createElement("button");
        rmImg.className = "rmImg";
        rmImg.innerHTML = ICONS.close;
        rmImg.title = "Remove image";
        rmImg.addEventListener("mousedown", function(e){ e.preventDefault(); e.stopPropagation(); });
        rmImg.addEventListener("click", function(e){
          e.stopPropagation();
          n.image = null;
          saveNotes();
          rerenderNote(n);
        });
        imgWrap.appendChild(rmImg);
      }
      el.appendChild(imgWrap);
    }

    var text = document.createElement("div");
    text.className = "text" + (n.done ? " done" : "");
    text.contentEditable = readOnly ? "false" : "true";
    text.spellcheck = false;
    text.setAttribute("data-placeholder","Type something…");
    text.style.fontFamily = fontStack(n.font);
    text.innerHTML = n.html || "";
    el.appendChild(text);
    n.textEl = text;

    if(!readOnly){
      var toolbar = document.createElement("div");
      toolbar.className = "toolbar";

      [["H1","h1"],["H2","h2"],["H3","h3"]].forEach(function(pair){
        var b = document.createElement("button");
        b.textContent = pair[0];
        b.title = "Heading " + pair[0].slice(1);
        b.addEventListener("mousedown", function(e){ e.preventDefault(); });
        b.addEventListener("click", function(){ applyFormat(text, "formatBlock", "<" + pair[1] + ">"); });
        toolbar.appendChild(b);
      });

      var ulBtn = document.createElement("button");
      ulBtn.innerHTML = ICONS.ul;
      ulBtn.title = "Bullet list";
      ulBtn.addEventListener("mousedown", function(e){ e.preventDefault(); });
      ulBtn.title = "Cycle list: bullet → numbered → none";
      ulBtn.addEventListener("click", function(){ cycleList(text); });
      toolbar.appendChild(ulBtn);

      var hlBtn = document.createElement("button");
      hlBtn.innerHTML = ICONS.highlighter;
      hlBtn.title = "Highlight selected text";
      hlBtn.addEventListener("mousedown", function(e){ e.preventDefault(); });
      hlBtn.addEventListener("click", function(){
        text.focus();
        try{ document.execCommand("hiliteColor", false, "#fff36b"); }catch(e){}
        text.dispatchEvent(new Event("input", {bubbles:true}));
      });
      toolbar.appendChild(hlBtn);

      var uploadBtn = document.createElement("button");
      uploadBtn.innerHTML = ICONS.image;
      uploadBtn.title = "Add an image";
      uploadBtn.addEventListener("mousedown", function(e){ e.preventDefault(); });
      uploadBtn.addEventListener("click", function(e){
        e.stopPropagation();
        pendingImageNote = n;
        imageUploadInput.value = "";
        imageUploadInput.click();
      });
      toolbar.appendChild(uploadBtn);

      toolbar.appendChild(Object.assign(document.createElement("span"), {className:"divider"}));

      var taskBtn = document.createElement("button");
      taskBtn.innerHTML = ICONS.task;
      taskBtn.title = "Mark as task";
      taskBtn.classList.toggle("active", !!n.isTask);
      taskBtn.addEventListener("mousedown", function(e){ e.preventDefault(); });
      taskBtn.addEventListener("click", function(){
        n.isTask = !n.isTask;
        saveNotes();
        rerenderNote(n);
      });
      toolbar.appendChild(taskBtn);

      toolbar.appendChild(Object.assign(document.createElement("span"), {className:"divider"}));

      var swatchWrap = document.createElement("div");
      swatchWrap.className = "swatchTrigger";
      var catDot = document.createElement("button");
      catDot.className = "colorDot";
      var cat = CATEGORIES[n.categoryIndex || 0];
      catDot.style.background = cat.hue == null ? cat.swatch : ("hsl(" + cat.hue + ",65%,55%)");
      catDot.title = "Color: " + cat.name;
      catDot.addEventListener("mousedown", function(e){ e.preventDefault(); });
      swatchWrap.appendChild(catDot);

      catDot.addEventListener("click", function(e){
        e.stopPropagation();
        var pop = openFloatingPopover(catDot, "colorPicker");
        if(!pop) return;

        var wheel = document.createElement("div");
        wheel.className = "hueWheel";
        var dot = document.createElement("div");
        dot.className = "hueDot";
        wheel.appendChild(dot);
        pop.appendChild(wheel);

        function placeDot(hue){
          var rad = (hue - 90) * Math.PI / 180;
          var r = 75;
          dot.style.left = (75 + r * Math.cos(rad)) + "px";
          dot.style.top = (75 + r * Math.sin(rad)) + "px";
          dot.style.background = "hsl(" + hue + ",62%,82%)";
        }
        function currentHue(){
          var m = /hsl\((\d+)/.exec(n.bg);
          return m ? +m[1] : 40;
        }
        placeDot(currentHue());

        function pickAt(clientX, clientY){
          var r = wheel.getBoundingClientRect();
          var cx = r.left + r.width/2, cy = r.top + r.height/2;
          var dx = clientX - cx, dy = clientY - cy;
          var deg = Math.atan2(dx, -dy) * 180 / Math.PI;
          if(deg < 0) deg += 360;
          n.categoryIndex = 0;
          n.bg = "hsl(" + Math.round(deg) + "," + Math.floor(rand(55,68)) + "%," + Math.floor(rand(79,85)) + "%)";
          el.style.setProperty("--note-bg", n.bg);
          catDot.style.background = n.bg;
          catDot.title = "Custom color";
          placeDot(Math.round(deg));
          saveNotes();
        }
        wheel.addEventListener("pointerdown", function(ev){
          ev.stopPropagation();
          pickAt(ev.clientX, ev.clientY);
          function move(mv){ pickAt(mv.clientX, mv.clientY); }
          function up(){ window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); }
          window.addEventListener("pointermove", move);
          window.addEventListener("pointerup", up);
        });

        var quickRow = document.createElement("div");
        quickRow.className = "quickRow";
        CATEGORIES.forEach(function(c, ci){
          var sw = document.createElement("button");
          sw.style.background = c.hue == null ? c.swatch : ("hsl(" + c.hue + ",65%,55%)");
          sw.title = c.name;
          sw.classList.toggle("active", ci === (n.categoryIndex||0));
          sw.addEventListener("mousedown", function(ev){ ev.preventDefault(); });
          sw.addEventListener("click", function(ev){
            ev.stopPropagation();
            n.categoryIndex = ci;
            n.bg = colorForCategory(ci);
            el.style.setProperty("--note-bg", n.bg);
            catDot.style.background = c.hue == null ? c.swatch : ("hsl(" + c.hue + ",65%,55%)");
            catDot.title = "Color: " + c.name;
            saveNotes();
            closeFloatingPopovers();
          });
          quickRow.appendChild(sw);
        });
        pop.appendChild(quickRow);
      });
      toolbar.appendChild(swatchWrap);

      var shareWrap = document.createElement("div");
      shareWrap.className = "swatchTrigger";
      var shareNoteBtn = document.createElement("button");
      shareNoteBtn.innerHTML = ICONS.share;
      shareNoteBtn.title = "Share this note";
      shareNoteBtn.addEventListener("mousedown", function(e){ e.preventDefault(); });
      shareNoteBtn.addEventListener("click", function(e){
        e.stopPropagation();
        openShareNotePopover(n, text);
      });
      shareWrap.appendChild(shareNoteBtn);
      toolbar.appendChild(shareWrap);

      if(n.isTask){
        var taskRow = document.createElement("div");
        taskRow.className = "taskRow";

        var doneBtn = document.createElement("button");
        doneBtn.className = "checkToggle" + (n.done ? " checked" : "");
        doneBtn.innerHTML = ICONS.check;
        doneBtn.title = "Mark done";
        doneBtn.addEventListener("mousedown", function(e){ e.preventDefault(); });
        doneBtn.addEventListener("click", function(){
          n.done = !n.done;
          saveNotes();
          rerenderNote(n);
        });
        taskRow.appendChild(doneBtn);

        var dateBtn = document.createElement("button");
        dateBtn.className = "dateTrigger";
        dateBtn.textContent = formatDueLabel(n.due);
        dateBtn.addEventListener("mousedown", function(e){ e.preventDefault(); e.stopPropagation(); });
        dateBtn.addEventListener("click", function(e){
          e.stopPropagation();
          openDatePicker(dateBtn, n.due, function(iso){
            n.due = iso;
            saveNotes();
            rerenderNote(n);
          });
        });
        taskRow.appendChild(dateBtn);

        var timeInput = document.createElement("input");
        timeInput.type = "time";
        timeInput.id = n.id + "-time";
        timeInput.value = n.dueTime || "09:00";
        timeInput.addEventListener("mousedown", function(e){ e.stopPropagation(); });
        timeInput.addEventListener("click", function(e){ e.stopPropagation(); });
        timeInput.addEventListener("change", function(){
          n.dueTime = timeInput.value;
          saveNotes();
          rerenderNote(n);
        });
        taskRow.appendChild(timeInput);

        if(n.due){
          var calBtn = document.createElement("button");
          calBtn.className = "calBtn";
          calBtn.innerHTML = ICONS.cal;
          calBtn.title = "Add to Google Calendar";
          calBtn.addEventListener("mousedown", function(e){ e.preventDefault(); e.stopPropagation(); });
          calBtn.addEventListener("click", function(e){
            e.stopPropagation();
            openCalendarPopover(n, calBtn);
          });
          taskRow.appendChild(calBtn);
        }

        var taskDock = document.createElement("div");
        taskDock.className = "taskDock";
        taskDock.appendChild(taskRow);
        el.appendChild(taskDock);
      }

      var moreBtn = document.createElement("button");
      moreBtn.className = "moreBtn";
      moreBtn.innerHTML = ICONS.more;
      moreBtn.title = "More actions";
      moreBtn.addEventListener("mousedown", function(e){ e.preventDefault(); e.stopPropagation(); });
      moreBtn.addEventListener("click", function(e){
        e.stopPropagation();
        var pop = openFloatingPopover(moreBtn, "moreMenu");
        if(!pop) return;
        pop.appendChild(toolbar);
      });
      el.appendChild(moreBtn);
    }

    boardInner.appendChild(el);

    if(!readOnly){
      el.addEventListener("pointerdown", function(){ bringToFront(n, el); }, {passive:true});

      text.addEventListener("input", function(){
        n.html = text.innerHTML;
        clearTimeout(text._t);
        text._t = setTimeout(saveNotes, 250);
      });
      text.addEventListener("keydown", function(e){
        if(e.key === "Enter" && !e.shiftKey){
          e.preventDefault();
          text.blur();
        }
      });
      text.addEventListener("focus", function(){
        setTimeout(function(){ adjustForKeyboard(text); }, 250);
      });
      text.addEventListener("blur", resetKeyboardShift);

      del.addEventListener("pointerdown", function(e){ e.stopPropagation(); });
      del.addEventListener("click", function(e){
        e.stopPropagation();
        deleteNoteById(n.id);
      });

      tab.addEventListener("pointerdown", function(e){
        e.stopPropagation();
        selectNote(n.id);
        bringToFront(n, el);
        startDrag(e, n, el);
      });

      el.addEventListener("dragover", function(e){ e.preventDefault(); e.stopPropagation(); el.classList.add("dragOver"); }, true);
      el.addEventListener("dragleave", function(e){ el.classList.remove("dragOver"); }, true);
      el.addEventListener("drop", function(e){
        e.preventDefault(); e.stopPropagation();
        el.classList.remove("dragOver");
        var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if(file && file.type.indexOf("image/") === 0) handleImageDrop(file, n);
      }, true);

      if(isNew){
        requestAnimationFrame(function(){ text.focus(); });
        el.addEventListener("animationend", function(){
          el.classList.remove("new");
        }, {once:true});
      }
    }

    return el;
  }

  function rerenderNote(n){
    var old = n.el;
    old.remove();
    renderNote(n, false);
    updateMinimap();
  }

  function bringToFront(n, el){
    zCounter += 1;
    n.z = zCounter;
    el.style.zIndex = n.z;
    saveNotes();
  }

  function startDrag(e, n, el){
    el.classList.add("dragging");
    var startX = e.clientX, startY = e.clientY;
    var origX = n.x, origY = n.y;
    var maxY = Math.max(0, boardHeight() - NOTE_H - 10);

    function move(ev){
      var dx = (ev.clientX - startX) / boardZoom;
      var dy = (ev.clientY - startY) / boardZoom;
      n.x = Math.max(0, origX + dx);
      n.y = Math.min(maxY, Math.max(0, origY + dy));
      el.style.left = n.x + "px";
      el.style.top = n.y + "px";
      updateMinimap();
    }
    function up(){
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      el.classList.remove("dragging");
      ensureWidth();
      saveNotes();
      updateMinimap();
    }
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  }

  function addNoteAt(x, y){
    zCounter += 1;
    var n = {
      id: "n" + Date.now() + Math.floor(rand(0,999)),
      x: Math.max(0, x - NOTE_W/2),
      y: Math.min(Math.max(0, boardHeight() - NOTE_H - 10), Math.max(0, y - 30)),
      w: NOTE_W,
      html: "",
      bg: randomColor(),
      font: pickFont(),
      rot: rand(-6,6),
      z: zCounter,
      categoryIndex: 0,
      isTask:false, done:false, due:"", dueTime:"09:00", image:null
    };
    notes.push(n);
    ensureWidth();
    renderNote(n, true);
    saveNotes();
    updateCount();
    updateMinimap();
    dismissHint();
  }

  var lastDeleted = null, lastDeletedTimer = null;
  function deleteNoteById(id){
    var idx = notes.findIndex(function(x){ return x.id === id; });
    if(idx === -1) return;
    var n = notes[idx];
    var hadContent = !!((n.textEl && getPlainText(n.textEl)) || n.image);
    if(selectedId === id) clearSelection();
    if(n.el){
      var elRef = n.el;
      elRef.classList.add("removing");
      elRef.addEventListener("animationend", function(){ elRef.remove(); }, {once:true});
    }
    notes.splice(idx, 1);
    saveNotes();
    updateCount();
    updateMinimap();
    if(!hadContent){
      toast("Note deleted.");
      return;
    }
    lastDeleted = {note:n, index:idx};
    clearTimeout(lastDeletedTimer);
    toast("Note deleted.", "Undo", function(){
      if(!lastDeleted) return;
      var restored = lastDeleted.note;
      notes.splice(Math.min(lastDeleted.index, notes.length), 0, restored);
      zCounter += 1;
      restored.z = zCounter;
      renderNote(restored, true);
      saveNotes();
      updateCount();
      updateMinimap();
      lastDeleted = null;
    });
    lastDeletedTimer = setTimeout(function(){ lastDeleted = null; }, 6000);
  }

  function handleImageDrop(file, n){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var maxDim = 480;
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        n.image = canvas.toDataURL("image/jpeg", 0.82);
        saveNotes();
        rerenderNote(n);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  imageUploadInput.addEventListener("change", function(){
    var file = imageUploadInput.files && imageUploadInput.files[0];
    if(file && pendingImageNote) handleImageDrop(file, pendingImageNote);
    pendingImageNote = null;
  });

  function openShareNotePopover(n, textEl){
    var name = getDisplayName();
    var plain = getPlainText(textEl) || "a sticky note";
    var shortDesc = plain.slice(0, 80);
    var payload = {html:n.html, bg:n.bg, font:n.font, rot:n.rot, isTask:!!n.isTask, done:!!n.done, due:n.due||"", dueTime:n.dueTime||"", byName:name};
    var encoded = encodeState(payload);
    var link = encoded ? (location.href.split("#")[0] + "#sn=" + encoded) : "";
    var msg = "Check out this sticky note by " + name + ": \"" + shortDesc + (plain.length > 80 ? "…" : "") + "\"" + (link ? ". Click to view: " + link : "");

    var backdrop = document.createElement("div");
    backdrop.className = "acctBackdrop";
    var card = document.createElement("div");
    card.className = "acctCard";
    card.style.width = "380px";
    backdrop.appendChild(card);
    document.body.appendChild(backdrop);
    function close(){ backdrop.remove(); document.removeEventListener("keydown", escHandler); }
    function escHandler(e){ if(e.key === "Escape") close(); }
    backdrop.addEventListener("click", function(e){ if(e.target === backdrop) close(); });
    document.addEventListener("keydown", escHandler);

    card.innerHTML =
      '<button class="acctClose" id="shareNoteClose" aria-label="Close">' + ICONS.close + '</button>' +
      '<h3>Share this note</h3>' +
      '<p class="acctSub">Here’s what they’ll see:</p>' +
      '<div style="display:flex;justify-content:center;margin-bottom:16px;">' +
        '<div class="note" style="position:relative;left:auto;top:auto;width:190px;min-height:130px;padding:18px 12px 12px;transform:rotate(' + n.rot + 'deg);background:' + n.bg + ';"></div>' +
      '</div>' +
      '<div style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:0.82rem;line-height:1.5;color:var(--ink);margin-bottom:14px;max-height:160px;overflow-y:auto;">' + escapeHtml(msg) + '</div>' +
      '<button class="guestBtn" id="copyMsgBtn" style="background:var(--accent);color:#fff;border-color:var(--accent);">Copy message</button>' +
      '<button class="acctBack" id="copyLinkOnlyBtn" style="display:block;text-align:center;width:100%;margin:12px 0 0;">Just copy the link</button>' +
      '<p class="acctSub" style="margin-top:14px;font-size:0.72rem;">A real, fully public link: anyone who opens it can view this note, no account needed.</p>';

    var previewNote = card.querySelector(".note");
    previewNote.style.background = n.bg;
    var previewText = document.createElement("div");
    previewText.className = "text";
    previewText.style.fontFamily = fontStack(n.font);
    previewText.style.fontSize = "1rem";
    previewText.style.minHeight = "auto";
    previewText.innerHTML = n.html || "";
    previewNote.appendChild(previewText);

    card.querySelector("#shareNoteClose").addEventListener("click", close);
    card.querySelector("#copyMsgBtn").addEventListener("click", async function(){
      try{ await navigator.clipboard.writeText(msg); toast("Message copied. Paste it into WhatsApp or email."); }
      catch(err){ toast("Couldn't copy automatically. Select the text above."); }
    });
    card.querySelector("#copyLinkOnlyBtn").addEventListener("click", async function(){
      if(!link){ toast("No link available."); return; }
      try{ await navigator.clipboard.writeText(link); toast("Link copied."); }
      catch(err){ toast("Couldn't copy automatically."); }
    });
  }

  function renderSingleNoteView(encoded){
    document.querySelector(".topbar").style.display = "none";
    board.style.display = "none";
    minimap.style.display = "none";
    hint.style.display = "none";
    var wrap = document.createElement("div");
    wrap.style.cssText = "min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;";
    document.body.appendChild(wrap);

    var item = decodeState(encoded);
    if(!item){
      wrap.innerHTML = '<p class="muted">This note link looks broken or incomplete.</p>';
      return;
    }

    var byline = document.createElement("p");
    byline.className = "muted";
    byline.textContent = "Shared by " + (item.byName || "someone");
    wrap.appendChild(byline);

    var card = document.createElement("div");
    card.className = "note";
    card.style.position = "relative";
    card.style.left = "auto";
    card.style.top = "auto";
    card.style.width = "260px";
    card.style.setProperty("--note-bg", item.bg || randomColor());
    card.style.setProperty("--rot", (item.rot || 0) + "deg");
    if(item.isTask){
      var b = document.createElement("div");
      b.className = "badge" + (item.done ? " done" : "");
      b.textContent = item.due ? ("Due " + item.due + (item.dueTime ? ", " + item.dueTime : "")) : "Task";
      card.appendChild(b);
    }
    var textDiv = document.createElement("div");
    textDiv.className = "text" + (item.done ? " done" : "");
    textDiv.style.fontFamily = fontStack(item.font || FONTS[0].name);
    textDiv.innerHTML = item.html || "";
    card.appendChild(textDiv);
    wrap.appendChild(card);

    var openBtn = document.createElement("button");
    openBtn.className = "btn primary";
    openBtn.style.width = "auto";
    openBtn.textContent = "Open Stick-It";
    openBtn.addEventListener("click", function(){ location.hash = ""; location.reload(); });
    wrap.appendChild(openBtn);
  }

  if(!readOnly){
    boardInner.addEventListener("click", function(e){
      if(e.target !== boardInner) return;
      clearSelection();
      var rect = boardInner.getBoundingClientRect();
      addNoteAt((e.clientX - rect.left) / boardZoom, (e.clientY - rect.top) / boardZoom);
    });
  }

  board.addEventListener("wheel", function(e){
    if(Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;
    board.scrollLeft += e.deltaY;
    e.preventDefault();
    dismissHint();
  }, {passive:false});

  board.addEventListener("scroll", function(){ dismissHint(); updateMinimapViewport(); closeFloatingPopovers(); }, {passive:true});

  // ---------- search ----------
  searchInput.addEventListener("input", function(){
    var q = searchInput.value.trim().toLowerCase();
    notes.forEach(function(n){
      if(!n.el) return;
      if(!q){ n.el.style.opacity = ""; n.el.style.pointerEvents = ""; return; }
      var hay = getPlainText(n.textEl).toLowerCase();
      var match = hay.indexOf(q) !== -1;
      n.el.style.opacity = match ? "1" : "0.15";
      n.el.style.pointerEvents = match ? "" : "none";
    });
  });

  // ---------- settings panel ----------
  function closeOtherPanels(except){
    [panel, sharePanel, boardPanel].forEach(function(p){ if(p !== except) p.hidden = true; });
    closeAccountModal();
  }
  gearBtn.addEventListener("click", function(){
    var willOpen = panel.hidden;
    closeOtherPanels(willOpen ? panel : null);
    panel.hidden = !willOpen;
    gearBtn.classList.remove("spin");
    void gearBtn.offsetWidth;
    gearBtn.classList.add("spin");
  });
  shareBtn.addEventListener("click", function(){
    var willOpen = sharePanel.hidden;
    closeOtherPanels(willOpen ? sharePanel : null);
    sharePanel.hidden = !willOpen;
  });
  document.addEventListener("click", function(e){
    if(!panel.hidden && !panel.contains(e.target) && e.target !== gearBtn && !gearBtn.contains(e.target)){
      panel.hidden = true;
    }
    if(!sharePanel.hidden && !sharePanel.contains(e.target) && e.target !== shareBtn && !shareBtn.contains(e.target)){
      sharePanel.hidden = true;
    }
  });

  // ---------- account: Google Sign-In or guest ----------
  var GOOGLE_ICON =
    '<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.43 3.58v2.98h3.94C22.2 19.1 23.5 15.98 23.5 12.27z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.92l-3.94-2.98c-1.08.72-2.45 1.15-3.99 1.15-3.07 0-5.67-2.07-6.6-4.85H1.34v3.07C3.3 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.4 14.4c-.24-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.75H1.34C.49 8.4 0 10.15 0 12.11s.49 3.71 1.34 5.36L5.4 14.4z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.79l3.5-3.5C17.94 1.19 15.24 0 12 0 7.31 0 3.3 2.7 1.34 6.75l4.06 3.07C6.33 6.94 8.93 4.75 12 4.75z"/></svg>';

  function decodeJwt(token){
    try{
      var b64 = token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
      var json = decodeURIComponent(atob(b64).split("").map(function(c){
        return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(""));
      return JSON.parse(json);
    }catch(e){ return null; }
  }

  function updateAccountIcon(){
    if(settings.account && settings.account.picture){
      accountBtn.innerHTML = '<img src="' + settings.account.picture + '" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">';
    } else {
      accountBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>';
    }
  }

  window.handleGoogleCredentialResponse = function(response){
    var payload = decodeJwt(response.credential);
    if(!payload) return;
    settings.account = { name: payload.name, email: payload.email, picture: payload.picture, sub: payload.sub };
    settings.guestConfirmed = false;
    saveSettings();
    updateAccountIcon();
    toast("Signed in as " + payload.name + ".");
    closeAccountModal();
  };

  function signOut(){
    settings.account = null;
    saveSettings();
    updateAccountIcon();
    try{ if(window.google && window.google.accounts) window.google.accounts.id.disableAutoSelect(); }catch(e){}
    renderAccountModal("choice");
  }

  var acctBackdrop = null;
  function closeAccountModal(){
    if(acctBackdrop){ acctBackdrop.remove(); acctBackdrop = null; }
  }
  function openAccountModal(){
    closeOtherPanels(null);
    closeAccountModal();
    acctBackdrop = document.createElement("div");
    acctBackdrop.className = "acctBackdrop";
    acctBackdrop.addEventListener("click", function(e){ if(e.target === acctBackdrop) closeAccountModal(); });
    var card = document.createElement("div");
    card.className = "acctCard";
    acctBackdrop.appendChild(card);
    document.body.appendChild(acctBackdrop);
    document.addEventListener("keydown", acctEscHandler);
    var initial = settings.account ? "signedIn" : (settings.guestConfirmed ? "guestHome" : "choice");
    renderAccountModal(initial);
  }
  function acctEscHandler(e){
    if(e.key === "Escape"){ closeAccountModal(); document.removeEventListener("keydown", acctEscHandler); }
  }

  function renderAccountModal(state){
    if(!acctBackdrop) return;
    var card = acctBackdrop.querySelector(".acctCard");
    var closeBtnHtml = '<button class="acctClose" id="acctCloseBtn" aria-label="Close">' + ICONS.close + '</button>';

    if(state === "signedIn" && settings.account){
      card.innerHTML = closeBtnHtml +
        '<div style="display:flex;flex-direction:column;align-items:center;">' +
          '<img src="' + settings.account.picture + '" alt="" style="width:64px;height:64px;border-radius:50%;object-fit:cover;margin-bottom:12px;">' +
          '<h3>' + escapeHtml(settings.account.name) + '</h3>' +
          '<p class="acctSub">' + escapeHtml(settings.account.email) + '</p>' +
        '</div>' +
        '<div class="acctWhy"><p>Your real name &amp; photo show up on anything you share: boards, notes, and any future collaboration features. Your notes themselves still only live in this browser.</p></div>' +
        '<button class="guestBtn" id="signOutBtn" style="margin-top:18px;color:var(--danger);border-color:var(--danger);">Sign out</button>';
      card.querySelector("#signOutBtn").addEventListener("click", signOut);

    } else if(state === "guestHome"){
      card.innerHTML = closeBtnHtml +
        '<h3 style="text-align:center;">Browsing as a guest</h3>' +
        '<p class="acctSub">Notes you share will show this name:</p>' +
        '<div style="display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:18px;">' +
          '<div style="width:40px;height:40px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);flex:none;">' + escapeHtml(getDisplayName().charAt(0).toUpperCase()) + '</div>' +
          '<input id="guestNameInput" type="text" value="' + escapeHtml(getDisplayName()) + '" placeholder="Nickname" style="flex:1;padding:9px 12px;border-radius:10px;border:1px solid var(--line);font-size:0.9rem;font-family:inherit;">' +
        '</div>' +
        '<div class="googleBtn" id="googleBtnFallback"></div>' +
        '<div id="googleBtnHolder" style="margin-top:2px;"></div>';
      mountGoogleButton();
      card.querySelector("#guestNameInput").addEventListener("input", function(e){
        settings.displayName = e.target.value.trim();
        saveSettings();
      });

    } else if(state === "guestCompare"){
      card.innerHTML =
        '<button class="acctBack" id="acctBackBtn">← Back</button>' +
        '<h3 style="text-align:center;">Here’s the difference</h3>' +
        '<p class="acctSub">No judgment either way, just so you know what you’re choosing.</p>' +
        '<div class="acctCompare">' +
          '<div><strong>Guest</strong><ul>' +
            '<li>No permissions asked</li>' +
            '<li>Shared notes show “Anon-XXXX”</li>' +
            '<li>Nothing leaves this browser</li>' +
            '<li>Premium features (coming soon) won’t be available</li>' +
          '</ul></div>' +
          '<div><strong>Google</strong><ul>' +
            '<li>Shares only name, email &amp; photo</li>' +
            '<li>Shared notes show your real name</li>' +
            '<li>Ready for premium &amp; multi-user features</li>' +
            '<li>Never your password, Gmail, Calendar, or Drive</li>' +
          '</ul></div>' +
        '</div>' +
        '<button class="guestBtn" id="confirmGuestBtn">Continue as guest</button>';
      card.querySelector("#acctBackBtn").addEventListener("click", function(){ renderAccountModal("choice"); });
      card.querySelector("#confirmGuestBtn").addEventListener("click", function(){
        settings.guestConfirmed = true;
        saveSettings();
        closeAccountModal();
        toast("You're browsing as a guest.");
      });

    } else {
      card.innerHTML = closeBtnHtml +
        '<h3>Sign in to Stick-It</h3>' +
        '<p class="acctSub">Optional. Pick whichever fits.</p>' +
        '<div class="googleBtn" id="googleBtnFallback"></div>' +
        '<div id="googleBtnHolder" style="margin-top:2px;"></div>' +
        '<button class="guestBtn" id="chooseGuestBtn">Continue as guest</button>' +
        '<div class="acctWhy">' +
          '<p>👤 Your real name &amp; photo on anything you share, instead of “Anon-4821.”</p>' +
          '<p>🔓 Only your name, email &amp; photo. Never your password, Gmail, Calendar, or Drive.</p>' +
          '<p>🚀 Sets you up for premium features and multi-user boards, coming soon.</p>' +
        '</div>';
      card.querySelector("#chooseGuestBtn").addEventListener("click", function(){ renderAccountModal("guestCompare"); });
      mountGoogleButton();
    }

    var closeBtn = card.querySelector("#acctCloseBtn");
    if(closeBtn) closeBtn.addEventListener("click", closeAccountModal);
  }

  function mountGoogleButton(){
    var fallback = document.getElementById("googleBtnFallback");
    var holder = document.getElementById("googleBtnHolder");
    if(!fallback || !holder) return;
    var configured = GOOGLE_CLIENT_ID.indexOf("YOUR_GOOGLE_CLIENT_ID") === -1;
    if(!configured || !window.google || !window.google.accounts){
      fallback.innerHTML = GOOGLE_ICON + "<span>Continue with Google</span>";
      fallback.addEventListener("click", function(){
        toast(configured ? "Still loading Google Sign-In. Try again in a second." : "Google Sign-In isn’t configured yet on this deployment.");
      });
      return;
    }
    fallback.style.display = "none";
    try{
      window.google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: window.handleGoogleCredentialResponse });
      window.google.accounts.id.renderButton(holder, { theme: "outline", size: "large", width: 304, text: "continue_with" });
    }catch(e){
      fallback.style.display = "flex";
      fallback.innerHTML = GOOGLE_ICON + "<span>Continue with Google</span>";
      fallback.addEventListener("click", function(){ toast("Google Sign-In couldn't load just now."); });
    }
  }

  accountBtn.addEventListener("click", openAccountModal);
  updateAccountIcon();

  FONTS.forEach(function(f){
    var opt = document.createElement("option");
    opt.value = f.name;
    opt.textContent = f.name;
    fontSelect.appendChild(opt);
  });
  fontSelect.value = settings.fontName;
  fontSelect.disabled = !settings.lockFont;
  lockToggle.classList.toggle("on", settings.lockFont);
  lockToggle.setAttribute("aria-checked", String(settings.lockFont));

  lockToggle.addEventListener("click", function(){
    settings.lockFont = !settings.lockFont;
    lockToggle.classList.toggle("on", settings.lockFont);
    lockToggle.setAttribute("aria-checked", String(settings.lockFont));
    fontSelect.disabled = !settings.lockFont;
    saveSettings();
  });

  darkToggle.classList.toggle("on", settings.theme === "dark");
  darkToggle.setAttribute("aria-checked", String(settings.theme === "dark"));
  darkToggle.addEventListener("click", function(){
    settings.theme = settings.theme === "dark" ? "light" : "dark";
    document.body.classList.toggle("dark", settings.theme === "dark");
    darkToggle.classList.toggle("on", settings.theme === "dark");
    darkToggle.setAttribute("aria-checked", String(settings.theme === "dark"));
    saveSettings();
  });
  fontSelect.addEventListener("change", function(){
    settings.fontName = fontSelect.value;
    saveSettings();
  });

  displayNameInput.value = settings.displayName || "";
  displayNameInput.addEventListener("input", function(){
    settings.displayName = displayNameInput.value.trim();
    saveSettings();
  });

  var clearArmed = false, clearTimer;
  clearBtn.addEventListener("click", function(){
    if(!clearArmed){
      clearArmed = true;
      clearBtn.textContent = "Click again to confirm";
      clearBtn.classList.add("confirm");
      clearTimer = setTimeout(function(){
        clearArmed = false;
        clearBtn.textContent = "Clear the board";
        clearBtn.classList.remove("confirm");
      }, 3500);
      return;
    }
    clearTimeout(clearTimer);
    clearArmed = false;
    clearBtn.textContent = "Clear the board";
    clearBtn.classList.remove("confirm");
    notes = [];
    boardInner.innerHTML = "";
    saveNotes();
    ensureWidth();
    updateCount();
    updateMinimap();
  });

  // ---------- export / import ----------
  function exportBoard(){
    var data = JSON.stringify(notes.map(function(n){
      return {x:n.x,y:n.y,html:n.html,bg:n.bg,font:n.font,rot:n.rot,categoryIndex:n.categoryIndex,isTask:n.isTask,done:n.done,due:n.due};
    }), null, 2);
    downloadBlob("stickit-board.json", new Blob([data], {type:"application/json"}));
    toast("Board exported.");
  }
  exportBtn.addEventListener("click", exportBoard);

  var importArmed = false, importTimer;
  importBtn.addEventListener("click", function(){
    if(!importArmed){
      var parsed;
      try{ parsed = JSON.parse(importArea.value); }
      catch(e){ toast("That doesn't look like valid board JSON."); return; }
      if(!Array.isArray(parsed)){ toast("Expected a JSON array of notes."); return; }
      importArmed = true;
      importBtn.textContent = "Click again to replace the board";
      importBtn.classList.add("danger","confirm");
      importTimer = setTimeout(function(){
        importArmed = false;
        importBtn.textContent = "Import (replaces current board)";
        importBtn.classList.remove("danger","confirm");
      }, 4000);
      return;
    }
    clearTimeout(importTimer);
    importArmed = false;
    importBtn.textContent = "Import (replaces current board)";
    importBtn.classList.remove("danger","confirm");
    try{
      var parsed2 = JSON.parse(importArea.value);
      boardInner.innerHTML = "";
      notes = parsed2.map(function(item, i){
        return {
          id: "n" + Date.now() + i,
          x: item.x||0, y: item.y||0, html: item.html || escapeHtml(item.text||""),
          bg: item.bg || randomColor(), font: item.font || pickFont(), rot: item.rot || 0,
          z: ++zCounter, categoryIndex: item.categoryIndex||0,
          isTask: !!item.isTask, done: !!item.done, due: item.due||""
        };
      });
      notes.forEach(function(n){ renderNote(n, false); });
      ensureWidth();
      saveNotes();
      updateCount();
      updateMinimap();
      importArea.value = "";
      toast("Board imported.");
    }catch(e){
      toast("Import failed. The JSON may be malformed.");
    }
  });

  // ---------- minimap ----------
  function updateMinimap(){
    minimapTrack.innerHTML = "";
    var boardWidth = ensureWidth();
    var trackWidth = minimapTrack.clientWidth || 1;
    notes.forEach(function(n){
      var m = document.createElement("div");
      m.className = "miniNote";
      m.style.left = ((n.x/boardWidth)*trackWidth) + "px";
      m.style.width = Math.max(3, (NOTE_W/boardWidth)*trackWidth) + "px";
      m.style.background = n.bg;
      minimapTrack.appendChild(m);
    });
    var view = document.createElement("div");
    view.className = "miniView";
    view.id = "miniViewIndicator";
    minimapTrack.appendChild(view);
    updateMinimapViewport();
  }
  function updateMinimapViewport(){
    var view = document.getElementById("miniViewIndicator");
    if(!view) return;
    var boardWidth = boardInner.scrollWidth || 1;
    var trackWidth = minimapTrack.clientWidth || 1;
    view.style.left = ((board.scrollLeft/boardWidth)*trackWidth) + "px";
    view.style.width = Math.max(8, (window.innerWidth/boardWidth)*trackWidth) + "px";
  }
  minimapTrack.addEventListener("click", function(e){
    var rect = minimapTrack.getBoundingClientRect();
    var ratio = (e.clientX - rect.left) / rect.width;
    var boardWidth = boardInner.scrollWidth;
    var target = ratio*boardWidth - window.innerWidth/2;
    board.scrollTo({left: Math.max(0, target), behavior:"smooth"});
  });
  window.addEventListener("resize", function(){ ensureWidth(); updateMinimap(); });

  // ---------- share: snapshot ----------
  snapshotBtn.addEventListener("click", async function(){
    shareResult.innerHTML = '<p class="muted">Rendering snapshot…</p>';
    if(typeof html2canvas !== "function"){
      shareResult.innerHTML = '<p class="muted">Snapshot tool didn\'t load. Try again in a moment.</p>';
      return;
    }
    try{
      var canvas = await html2canvas(document.body, {
        backgroundColor: "#faf6e8",
        windowWidth: window.innerWidth,
        windowHeight: window.innerHeight,
        scale: Math.min(window.devicePixelRatio || 1, 2)
      });
      canvas.toBlob(async function(blob){
        if(!blob){ shareResult.innerHTML = '<p class="muted">Couldn\'t render a snapshot.</p>'; return; }
        var url = URL.createObjectURL(blob);
        shareResult.innerHTML = "";
        var img = document.createElement("img");
        img.src = url;
        shareResult.appendChild(img);
        var row = document.createElement("div");
        row.className = "copyRow";
        var saveBtn = document.createElement("button");
        saveBtn.className = "btn primary";
        saveBtn.style.margin = "8px 0 0";
        saveBtn.textContent = "Save image";
        saveBtn.addEventListener("click", function(){
          downloadBlob("stickit-snapshot.jpg", blob);
          toast("Snapshot saved.");
        });
        shareResult.appendChild(saveBtn);
      }, "image/jpeg", 0.92);
    }catch(e){
      shareResult.innerHTML = '<p class="muted">Couldn\'t render a snapshot in this view.</p>';
    }
  });

  // ---------- share: interactive link ----------
  publishBtn.addEventListener("click", function(){
    var payload = notes.map(function(n){
      return {x:n.x,y:n.y,html:n.html,bg:n.bg,font:n.font,rot:n.rot,isTask:!!n.isTask,done:!!n.done,due:n.due||""};
    });
    var encoded = encodeState(payload);
    if(!encoded){
      shareResult.innerHTML = '<p class="muted">Couldn\'t encode the board for sharing. Try the snapshot image instead.</p>';
      return;
    }
    var link = location.href.split("#")[0] + "#sb=" + encoded;
    shareResult.innerHTML = "";
    var p = document.createElement("p");
    p.className = "muted";
    p.textContent = link.length > 6000
      ? "This link is long (your board has a lot of notes) but it's a real, fully public link: anyone can open it, no account needed."
      : "A real, fully public link: anyone who opens it can view this board, no account needed.";
    shareResult.appendChild(p);
    var row = document.createElement("div");
    row.className = "copyRow";
    var input = document.createElement("input");
    input.readOnly = true;
    input.value = link;
    input.id = "shareLinkInput";
    row.appendChild(input);
    var copyBtn = document.createElement("button");
    copyBtn.className = "btn primary";
    copyBtn.style.margin = "0";
    copyBtn.style.width = "auto";
    copyBtn.textContent = "Copy";
    copyBtn.addEventListener("click", async function(){
      try{ await navigator.clipboard.writeText(link); toast("Link copied."); }
      catch(e){ input.select(); toast("Select the link and copy it manually."); }
    });
    row.appendChild(copyBtn);
    shareResult.appendChild(row);
  });

  // ---------- shared read-only view ----------
  if(readOnly){
    shareBanner.hidden = false;
    var shared = decodeState(location.hash.replace(/^#sb=/, "")) || [];
    if(!shared.length){
      shareBannerText.textContent = "This shared board link looks broken or empty.";
      copyToMineBtn.hidden = true;
    } else {
      shared.forEach(function(item, i){
        var n = {
          id: "s" + i, x:item.x||0, y:item.y||0, html:item.html||"",
          bg:item.bg||randomColor(), font:item.font||FONTS[0].name, rot:item.rot||0,
          z: i+1, categoryIndex:0, isTask:!!item.isTask, done:!!item.done, due:item.due||""
        };
        notes.push(n);
        renderNote(n, false);
      });
      ensureWidth();
      updateMinimap();
    }

    copyToMineBtn.addEventListener("click", function(){
      var mine = safeGet(NOTES_KEY) || [];
      shared.forEach(function(item, i){
        mine.push({
          id: "n" + Date.now() + i, x:(item.x||0)+20, y:(item.y||0)+20, html:item.html||"",
          bg:item.bg||randomColor(), font:item.font||FONTS[0].name, rot:item.rot||0,
          z: 1, categoryIndex:0, isTask:!!item.isTask, done:!!item.done, due:item.due||""
        });
      });
      safeSet(NOTES_KEY, mine);
      location.hash = "";
      location.reload();
    });
  }

  // ---------- interactive tour ----------
  var tourRoot = null, tourIndex = 0, tourSteps = [];
  function buildTourSteps(){
    var steps = [
      {sel:null, title:"Welcome to Stick-It", body:"A little corkboard for quick notes. Let's walk through what you can do. Hit Next to begin."},
      {sel:"#boardInner", title:"Stick a note", body:"Click any empty spot on the board to pin a new note there, ready to type into right away."},
      {sel:".note", title:"Move, format, delete", body:"Drag a note by its tape tab to move it. Hover a note to reveal its × and its toolbar for headings, bullet lists, color categories and marking it a task."},
      {sel:"#searchInput", title:"Find a note", body:"Type here to dim every note that doesn't match. Handy once the board fills up."},
      {sel:"#minimap", title:"See the whole board", body:"This strip mirrors every note's position along the board. Click anywhere on it to jump straight there."},
      {sel:"#accountBtn", title:"Sign in (optional)", body:"Sign in with Google so your real name and photo show up on notes you share, or stay a guest. Totally up to you."},
      {sel:"#gearBtn", title:"Settings", body:"Lock new notes to one font, export or import your board as JSON, or clear everything."},
      {sel:"#shareBtn", title:"Share your board", body:"Get a real, fully public link anyone can open as a read-only board (no account needed), or grab a JPEG snapshot of what's on screen right now."},
      {sel:null, title:"That's it!", body:"Click anywhere on the board to get started."}
    ];
    return steps.filter(function(s){
      if(!s.sel) return true;
      var el = document.querySelector(s.sel);
      if(!el) return false;
      var r = el.getBoundingClientRect();
      return r.width > 0 && r.height > 0;
    });
  }

  function startTour(){
    panel.hidden = true; sharePanel.hidden = true;
    tourSteps = buildTourSteps();
    tourIndex = 0;
    tourRoot = document.createElement("div");
    var block = document.createElement("div");
    block.className = "tourBlock";
    var spot = document.createElement("div");
    spot.className = "spotlight";
    var card = document.createElement("div");
    card.className = "tourCard";
    tourRoot.appendChild(block);
    tourRoot.appendChild(spot);
    tourRoot.appendChild(card);
    document.body.appendChild(tourRoot);
    renderTourStep();
    window.addEventListener("resize", positionTourStep);
  }
  function endTour(){
    if(!tourRoot) return;
    window.removeEventListener("resize", positionTourStep);
    tourRoot.remove();
    tourRoot = null;
  }
  function renderTourStep(){
    var card = tourRoot.querySelector(".tourCard");
    var step = tourSteps[tourIndex];
    var dotsHtml = tourSteps.map(function(s,i){ return '<span class="' + (i===tourIndex?"active":"") + '"></span>'; }).join("");
    card.innerHTML =
      "<h4>" + step.title + "</h4>" +
      "<p>" + step.body + "</p>" +
      '<div class="tourFoot">' +
        '<button class="tourSkip" id="tourSkip">Skip</button>' +
        '<div class="tourDots">' + dotsHtml + "</div>" +
        '<div class="tourBtns">' +
          (tourIndex > 0 ? '<button id="tourBack">Previous</button>' : "") +
          '<button class="primary" id="tourNext">' + (tourIndex === tourSteps.length-1 ? "Done" : "Next") + "</button>" +
        "</div>" +
      "</div>";
    card.querySelector("#tourSkip").addEventListener("click", endTour);
    var backBtn = card.querySelector("#tourBack");
    if(backBtn) backBtn.addEventListener("click", function(){ tourIndex--; renderTourStep(); });
    card.querySelector("#tourNext").addEventListener("click", function(){
      if(tourIndex === tourSteps.length-1){ endTour(); return; }
      tourIndex++; renderTourStep();
    });
    positionTourStep();
  }
  function positionTourStep(){
    if(!tourRoot) return;
    var spot = tourRoot.querySelector(".spotlight");
    var card = tourRoot.querySelector(".tourCard");
    var step = tourSteps[tourIndex];
    var target = step.sel ? document.querySelector(step.sel) : null;
    var pad = 8;
    var r = target ? target.getBoundingClientRect() : null;
    if(r){
      spot.style.left = (r.left - pad) + "px";
      spot.style.top = (r.top - pad) + "px";
      spot.style.width = (r.width + pad*2) + "px";
      spot.style.height = (r.height + pad*2) + "px";
    } else {
      var cx = window.innerWidth/2, cy = window.innerHeight/2;
      spot.style.left = cx + "px";
      spot.style.top = cy + "px";
      spot.style.width = "0px";
      spot.style.height = "0px";
    }
    var cardW = 280;
    var top, left;
    if(r){
      top = r.bottom + pad + 14;
      if(top + 180 > window.innerHeight) top = Math.max(70, r.top - 190);
      left = Math.min(Math.max(16, r.left), window.innerWidth - cardW - 16);
    } else {
      top = window.innerHeight/2 - 90;
      left = window.innerWidth/2 - cardW/2;
    }
    card.style.top = top + "px";
    card.style.left = left + "px";
  }
  helpBtn.addEventListener("click", startTour);

  var SHORTCUT_GROUPS = [
    { title: "Selecting & moving", items: [
      ["Click a note's tab", "Select it"],
      ["Arrow keys", "Nudge the selected note &middot; hold Shift for bigger steps"],
      ["Delete / Backspace", "Delete the selected note"]
    ]},
    { title: "Resizing & zoom", items: [
      ["Ctrl/Cmd + / -", "Resize the selected note, or zoom the board if nothing's selected"],
      ["Ctrl/Cmd + 0", "Reset that note's size, or the board zoom"]
    ]},
    { title: "Typing in a note", items: [
      ["Enter", "Finish editing"],
      ["Shift + Enter", "New line"],
      ["Esc", "Close a popover, or deselect / stop editing"]
    ]}
  ];
  function showShortcutsPopover(){
    if(openPopoverTrigger === kbdBtn) return;
    var pop = openFloatingPopover(kbdBtn, "kbdPop");
    if(!pop) return;
    pop.innerHTML = "<h4>Keyboard shortcuts</h4>" + SHORTCUT_GROUPS.map(function(g, gi){
      return (gi > 0 ? '<div class="kbdSep"></div>' : "") +
        '<div class="kbdGroupTitle">' + g.title + "</div><dl>" +
        g.items.map(function(s){ return "<dt>" + s[0] + "</dt><dd>" + s[1] + "</dd>"; }).join("") +
        "</dl>";
    }).join("");
    pop.addEventListener("mouseleave", function(){
      if(openPopoverTrigger === kbdBtn) closeFloatingPopovers();
    });
  }
  kbdBtn.addEventListener("mouseenter", showShortcutsPopover);
  kbdBtn.addEventListener("mouseleave", function(){
    setTimeout(function(){
      if(openPopoverTrigger === kbdBtn && openPopover && !openPopover.matches(":hover")){
        closeFloatingPopovers();
      }
    }, 150);
  });
  kbdBtn.addEventListener("click", function(e){
    e.stopPropagation();
    if(openPopoverTrigger === kbdBtn){ closeFloatingPopovers(); return; }
    showShortcutsPopover();
  });

  // ---------- board switcher ----------
  function renderBoardList(){
    boardList.innerHTML = "";
    boards.forEach(function(b){
      var row = document.createElement("div");
      row.className = "boardRow" + (b.id === activeBoardId ? " active" : "");
      var nameSpan = document.createElement("span");
      nameSpan.className = "name";
      nameSpan.textContent = b.name;
      row.appendChild(nameSpan);
      row.addEventListener("click", function(){
        if(b.id === activeBoardId) return;
        safeSet(ACTIVE_BOARD_KEY, b.id);
        location.hash = "";
        location.reload();
      });

      var renameBtn = document.createElement("button");
      renameBtn.innerHTML = ICONS.pencil;
      renameBtn.title = "Rename";
      renameBtn.addEventListener("click", function(e){
        e.stopPropagation();
        var input = document.createElement("input");
        input.value = b.name;
        row.innerHTML = "";
        row.appendChild(input);
        input.focus(); input.select();
        function commit(){
          var v = input.value.trim();
          if(v) b.name = v;
          safeSet(BOARDS_KEY, boards);
          renderBoardList();
          updateBoardLabel();
        }
        input.addEventListener("keydown", function(ev){
          if(ev.key === "Enter") commit();
          if(ev.key === "Escape") renderBoardList();
        });
        input.addEventListener("blur", commit);
      });
      row.appendChild(renameBtn);

      if(boards.length > 1){
        var delBtn = document.createElement("button");
        delBtn.innerHTML = ICONS.close;
        delBtn.title = "Delete board";
        delBtn.addEventListener("click", function(e){
          e.stopPropagation();
          if(!confirm2(delBtn)) return;
          boards = boards.filter(function(x){ return x.id !== b.id; });
          safeSet(BOARDS_KEY, boards);
          try{ localStorage.removeItem(notesKeyFor(b.id)); }catch(err){}
          if(b.id === activeBoardId){
            safeSet(ACTIVE_BOARD_KEY, boards[0].id);
            location.hash = "";
            location.reload();
            return;
          }
          renderBoardList();
        });
        row.appendChild(delBtn);
      }

      boardList.appendChild(row);
    });
  }
  function confirm2(btn){
    if(btn.dataset.armed === "1"){ return true; }
    btn.dataset.armed = "1";
    btn.innerHTML = ICONS.check;
    btn.title = "Click again to confirm delete";
    setTimeout(function(){ btn.dataset.armed = "0"; btn.innerHTML = ICONS.close; btn.title = "Delete board"; }, 3000);
    return false;
  }
  function updateBoardLabel(){
    var b = boards.filter(function(x){ return x.id === activeBoardId; })[0];
    boardNameLabel.textContent = b ? b.name : "";
  }

  if(!readOnly && !singleNoteMode){
    updateBoardLabel();
    brandBtn.addEventListener("click", function(){
      var willOpen = boardPanel.hidden;
      closeOtherPanels(willOpen ? boardPanel : null);
      boardPanel.hidden = !willOpen;
      if(willOpen) renderBoardList();
    });
    document.addEventListener("click", function(e){
      if(!boardPanel.hidden && !boardPanel.contains(e.target) && !brandBtn.contains(e.target)){
        boardPanel.hidden = true;
      }
    });
    addBoardBtn.addEventListener("click", function(){
      var name = newBoardName.value.trim() || "New board";
      var id = "b" + Date.now().toString(36) + Math.floor(rand(0,99));
      boards.push({id:id, name:name});
      safeSet(BOARDS_KEY, boards);
      safeSet(ACTIVE_BOARD_KEY, id);
      newBoardName.value = "";
      location.hash = "";
      location.reload();
    });
    newBoardName.addEventListener("keydown", function(e){
      if(e.key === "Enter") addBoardBtn.click();
    });
  }

  // ---------- selection + keyboard shortcuts ----------
  var selectedId = null;
  function selectNote(id){
    if(selectedId){
      var prev = notes.find(function(x){ return x.id === selectedId; });
      if(prev && prev.el) prev.el.classList.remove("selected");
    }
    selectedId = id;
    var n = notes.find(function(x){ return x.id === id; });
    if(n && n.el) n.el.classList.add("selected");
  }
  function clearSelection(){
    if(!selectedId) return;
    var prev = notes.find(function(x){ return x.id === selectedId; });
    if(prev && prev.el) prev.el.classList.remove("selected");
    selectedId = null;
  }

  if(!readOnly && !singleNoteMode){
    document.addEventListener("keydown", function(e){
      var ae = document.activeElement;
      var typing = ae && (ae.isContentEditable || ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.tagName === "SELECT");
      if(e.key === "Escape"){
        closeFloatingPopovers();
        if(typing){ ae.blur(); }
        else if(selectedId){ clearSelection(); }
        return;
      }

      var isZoomKey = (e.ctrlKey || e.metaKey) && (e.key === "+" || e.key === "=" || e.key === "-" || e.key === "_" || e.key === "0");
      if(isZoomKey && !typing){
        e.preventDefault();
        var selNote = selectedId ? notes.find(function(x){ return x.id === selectedId; }) : null;
        if(selNote){
          if(e.key === "0"){ selNote.w = NOTE_W; }
          else{
            var wStep = (e.key === "-" || e.key === "_") ? -20 : 20;
            selNote.w = Math.min(420, Math.max(160, (selNote.w || NOTE_W) + wStep));
          }
          if(selNote.el) selNote.el.style.width = selNote.w + "px";
          saveNotes();
          updateMinimap();
        } else {
          if(e.key === "0"){ boardZoom = 1; }
          else{
            var zStep = (e.key === "-" || e.key === "_") ? -0.1 : 0.1;
            boardZoom = Math.round(Math.min(1.6, Math.max(0.5, boardZoom + zStep)) * 100) / 100;
          }
          applyZoom();
        }
        return;
      }

      if(typing || !selectedId) return;
      var n = notes.find(function(x){ return x.id === selectedId; });
      if(!n){ selectedId = null; return; }
      var step = e.shiftKey ? 20 : 4;
      var moved = true;
      if(e.key === "ArrowUp"){ n.y = Math.max(0, n.y - step); }
      else if(e.key === "ArrowDown"){ n.y = Math.min(Math.max(0, boardHeight() - NOTE_H - 10), n.y + step); }
      else if(e.key === "ArrowLeft"){ n.x = Math.max(0, n.x - step); }
      else if(e.key === "ArrowRight"){ n.x = n.x + step; ensureWidth(); }
      else if(e.key === "Delete" || e.key === "Backspace"){ e.preventDefault(); deleteNoteById(n.id); return; }
      else { moved = false; }
      if(moved){
        e.preventDefault();
        if(n.el){ n.el.style.left = n.x + "px"; n.el.style.top = n.y + "px"; }
        saveNotes();
        updateMinimap();
      }
    });
  }

  // ---------- boot ----------
  if(singleNoteMode){
    renderSingleNoteView(location.hash.replace(/^#sn=/, ""));
  } else {
    ensureWidth();
    notes.forEach(function(n){ renderNote(n, false); });
    updateCount();
    applyZoom();
    updateMinimap();

    if(!firstRun || readOnly) hint.classList.add("hidden");
    else setTimeout(dismissHint, 7000);
  }
  setTimeout(function(){ setLogo("ready"); }, 450);
})();
</script>
</body>
</html>
